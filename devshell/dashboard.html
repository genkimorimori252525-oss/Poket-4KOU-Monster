<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>開発シェル</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1218;--panel:#191e27;--line:#2c3442;--text:#dfe6f0;--dim:#8b97a8;--accent:#f0a020;--mk:#7ad6a0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"DotGothic16","MS Gothic","Hiragino Kaku Gothic ProN",monospace;}
body{padding:10px 10px 60px;}
h1{font-size:14px;margin:2px 0 8px;color:var(--accent);letter-spacing:1px;}
.wrap{max-width:720px;margin:0 auto;}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:8px;}
.sec>h2{font-size:12px;margin:0;color:var(--accent);padding:10px 12px;cursor:pointer;
  display:flex;justify-content:space-between;letter-spacing:1px;}
.sec>div{padding:0 12px 12px;}
.sec.closed>div{display:none;}
.hint{font-size:10px;color:var(--dim);line-height:1.6;margin-top:6px;}
button{background:#252d3a;border:1px solid var(--line);color:var(--text);border-radius:3px;
  padding:9px 6px;font-size:11px;font-family:inherit;cursor:pointer;}
button:active{background:var(--mk);color:#0f1218;}
button.go{background:#1d5a3a;border-color:#2c8a5c;color:#d0f5e4;}
button[disabled]{color:var(--dim);border-color:#232a35;background:#1a1f28;cursor:not-allowed;}
button[disabled]:active{background:#1a1f28;color:var(--dim);}
.entryRow{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.entryRow .label{font-size:11px;color:var(--dim);flex:1;}
.entryRow button{flex:none;padding:9px 14px;}
.stageRow{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:4px;}
.stageRow .hint{margin:0;}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:3px;gap:8px;}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .sub{color:var(--dim);flex:none;}
.tot{font-size:11px;color:var(--mk);margin-bottom:6px;}
.bar{height:5px;background:#232a35;border-radius:3px;overflow:hidden;margin:5px 0 3px;}
.bar>i{display:block;height:100%;background:var(--mk);}
/* .sec>h2 の既定色は accent(警告色と共用)。verifyHead は古さの合図に accent を使うので、
   通常時は既定色ではなく text にしとかんと「古い」時との区別が付かん。 */
#verifyHead,#buildHead{color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">開発シェル</h1>

  <div class="sec" id="projSec" style="display:none">
    <h2 id="projHead">プロジェクト</h2>
    <div>
      <div id="projBody"></div>
      <div class="hint" id="projHint"></div>
    </div>
  </div>

  <div class="sec" id="screenSec">
    <h2>画面</h2>
    <div>
      <div id="screens"></div>
      <div class="hint" id="screensHint"></div>
    </div>
  </div>

  <div class="sec" id="verifySec">
    <h2 id="verifyHead">検証</h2>
    <div><div id="verifyBody"></div></div>
  </div>

  <div class="sec" id="monsSec">
    <h2 id="monsHead">保存したもの</h2>
    <div>
      <div id="monsBody"></div>
      <div class="hint" id="monsHint"></div>
    </div>
  </div>

  <div class="sec" id="usageSec">
    <h2>置き場</h2>
    <div><div id="usageBody"></div></div>
  </div>

  <div class="sec" id="buildSec">
    <h2 id="buildHead">軽量ビルド</h2>
    <div><div id="buildBody"></div></div>
  </div>
</div>

<script>
/* この画面は「見るだけ」。localStorage へ書き戻す経路は作らん
   （setItem / removeItem / clear をここに書かん。「見る」操作でデータを書き換えん —— 掟）。
   固有のキー名やラベルもここには書かん。全部 shell.config.json から取る（別プロジェクトへ持ち出せるように）。 */
var CFG = null;
var DAY_MS = 24 * 60 * 60 * 1000;

function kb(n) { return Math.round(n / 1024) + ' KB'; }

function formatAge(ms) {
  if (ms == null) return null;
  var sec = Math.floor(ms / 1000);
  if (sec < 60) return sec + '秒前';
  var min = Math.floor(sec / 60);
  if (min < 60) return min + '分前';
  var hour = Math.floor(min / 60);
  if (hour < 24) return hour + '時間前';
  return Math.floor(hour / 24) + '日前';
}

(async function () {
  try {
    CFG = await (await fetch('/__shell/config.json')).json();
  } catch (e) {
    document.getElementById('screensHint').textContent = '設定を読めんかった: ' + e;
    return;
  }
  document.title = CFG.projectName + ' 開発シェル';
  document.getElementById('pageTitle').textContent = CFG.projectName;

  var status = null;
  try { status = await (await fetch('/__shell/status')).json(); } catch (e) { status = null; }

  /* データはサーバーのファイルから読む。localStorage は見ん ——
     この画面自身にはアプリの保存コードが入っとらんけん、localStorage は常に空になる。
     ファイルが正になった今、サーバーから読むのが素直（Phase 3）。 */
  /* 設定に無いパネルは出さんし、読みにも行かん。
     ハブ（projects だけの設定）でプロジェクト用の口を叩いて 404 を出すと、
     コンソールが無害なノイズで埋まって**本物のエラーが隠れる**。 */
  var hasData   = (CFG.storage || []).length > 0 || !!CFG.dataDir;
  var hasScreen = (CFG.screens || []).length > 0;
  var hasVerify = (CFG.verifyStages || []).length > 0;
  var hasBuild  = !!CFG.buildInfo;

  var data = null;
  if (hasData) { try { data = await loadData(); } catch (e) { data = null; } }

  await drawProjects();

  if (hasScreen) drawScreens(status); else hide('screenSec');
  if (hasVerify) drawVerify(status);  else hide('verifySec');
  if (hasData) { drawStores(data); drawUsage(data); } else { hide('monsSec'); hide('usageSec'); }
  if (hasBuild) drawBuild(status);    else hide('buildSec');
})();

function hide(id) { var e = document.getElementById(id); if (e) e.style.display = 'none'; }

/* data/ の中身を集めてくる。1ファイルずつ取るけん件数ぶん往復するが、
   開いた時の1回だけやし、個体は数体〜数十体の想定 */
async function loadData() {
  var idx = await (await fetch('/__shell/data-index')).json();
  var files = idx.files || [];
  var monFiles = files.filter(function (f) { return /^monsters\/[^/]+\.json$/.test(f.path); });
  var mons = [];
  for (var i = 0; i < monFiles.length; i++) {
    try {
      var m = await (await fetch('/data/' + monFiles[i].path)).json();
      m._bytes = monFiles[i].bytes;
      /* この個体のメディア（写真・鳴き声）の合計。
         monsters/<id>.json に対して monsters/<id>/ 以下がその個体のもの */
      var dir = monFiles[i].path.replace(/\.json$/, '') + '/';
      m._mediaBytes = files.filter(function (f) { return f.path.indexOf(dir) === 0; })
                           .reduce(function (a, f) { return a + f.bytes; }, 0);
      mons.push(m);
    } catch (e) {}
  }
  var one = async function (rel) { try { return await (await fetch('/data/' + rel)).json(); } catch (e) { return null; } };
  return {
    files: files,
    totalBytes: files.reduce(function (a, f) { return a + f.bytes; }, 0),
    mons: mons,
    lib: await one('moves/library.json'),
    wild: await one('wild-pool.json'),
    audio: await one('audio/config.json'),
    scene: await one('audio/scene.json')
  };
}

/* ---- プロジェクト一覧（ハブのとき）。種類を問わん共通の状態だけ出す ----
   そのプロジェクトにしか無いもの（保存の中身・ビルド成果）は出さん。種類が違えば無いけん。
   config.projects が無ければこのパネルごと出さん＝今までどおりのプロジェクト用シェル。 */
async function drawProjects() {
  if (!(CFG.projects || []).length) return;
  var sec = document.getElementById('projSec');
  var body = document.getElementById('projBody');
  sec.style.display = '';
  var data;
  try { data = await (await fetch('/__shell/projects')).json(); }
  catch (e) { body.innerHTML = '<div class="hint">プロジェクトを読めんかった: ' + e + '</div>'; return; }

  var list = data.projects || [];
  document.getElementById('projHead').textContent = 'プロジェクト　' + list.length + '件';
  body.innerHTML = '';

  list.forEach(function (p) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'padding:7px 0;border-top:1px solid var(--line)';

    var top = document.createElement('div');
    top.className = 'entryRow';
    var nm = document.createElement('span');
    nm.className = 'label';
    nm.style.color = 'var(--text)';
    nm.textContent = p.label + (p.kind ? '　' + p.kind : '');
    top.appendChild(nm);

    var open = document.createElement('button');
    open.className = p.hasShell ? 'go' : '';
    open.textContent = p.exists ? (p.hasShell ? '開く' : 'フォルダ') : '無い';
    open.disabled = !p.exists;
    open.addEventListener('click', function () {
      open.textContent = '…';
      fetch('/__shell/open', { method: 'POST', body: JSON.stringify({ dir: p.dir }) })
        .then(function (r) { return r.json(); })
        .then(function (j) { open.textContent = j.ok ? '開いた' : '失敗'; })
        .catch(function () { open.textContent = '失敗'; });
    });
    top.appendChild(open);
    wrap.appendChild(top);

    if (p.exists) {
      /* 出すんは**数えるだけで分かること**に限る。推定した数字は出さん。 */
      var put = function (label, valueHtml, sub) {
        var r = document.createElement('div'); r.className = 'row';
        var a = document.createElement('span'); a.className = 'nm'; a.innerHTML = label;
        var c = document.createElement('span'); c.className = 'sub'; c.innerHTML = valueHtml;
        r.appendChild(a); r.appendChild(c); wrap.appendChild(r);
        if (sub) { var h = document.createElement('div'); h.className = 'hint'; h.style.margin = '1px 0 3px'; h.textContent = sub; wrap.appendChild(h); }
      };

      if (p.git) {
        var dirty = p.git.dirty || 0;
        var dirtyTxt = dirty
          ? '<span style="color:var(--accent)">未コミット ' + dirty + '件'
            + (p.git.untracked ? '（うち新規 ' + p.git.untracked + '）' : '') + '</span>'
          : '<span style="color:var(--mk)">きれい</span>';
        var rem = (p.git.ahead != null)
          ? '　先 ' + p.git.ahead + ' / 遅れ ' + p.git.behind
          : '';
        put(p.git.branch + '　' + dirtyTxt + rem,
            p.git.lastAt ? formatAge(Date.now() - new Date(p.git.lastAt).getTime()) : '',
            p.git.lastSubject || '');

        /* 活動量。数えただけ */
        if (p.git.commits30 != null) {
          put('コミット', '7日 ' + p.git.commits7 + '　30日 ' + p.git.commits30
              + '　通算 ' + p.git.total);
        }
      } else {
        put('git 管理外', '');
      }

      /* ビルド／検証が最後に通った時。**古さを必ず添える** */
      if (p.build) {
        put('最後のビルド', p.build.name + '　' + Math.round(p.build.bytes / 1024) + ' KB'
            + '　' + formatAge(Date.now() - p.build.at));
      }
      if (p.verify) {
        var vok = p.verify.ok
          ? '<span style="color:var(--mk)">' + p.verify.stages + '段 通過</span>'
          : '<span style="color:var(--accent)">失敗</span>';
        put('最後の検証', vok + (p.verify.at ? '　' + formatAge(Date.now() - new Date(p.verify.at).getTime()) : ''));
      }

      /* GSD は**数のまま**。率にはせん —— 「3/4」は事実やが「75%」は主張になる */
      if (p.gsd) {
        var g = 'GSD';
        if (p.gsd.phaseName) g += '　' + p.gsd.phaseName;
        var v = [];
        if (p.gsd.phases) v.push('フェーズ ' + p.gsd.phases.done + '/' + p.gsd.phases.total);
        if (p.gsd.reqs)   v.push('要件 ' + p.gsd.reqs.done + '/' + p.gsd.reqs.total);
        if (p.gsd.status) v.push('[' + p.gsd.status + ']');
        put(g, v.join('　'), p.gsd.activity || '');
      }

      /* にーくらが設定に書いた分だけ。書いとらんかったら**何も出さん**（0% とは出さん） */
      if (typeof p.percent === 'number') {
        var bar = document.createElement('div'); bar.className = 'bar';
        var fill = document.createElement('i');
        fill.style.width = Math.max(0, Math.min(100, p.percent)) + '%';
        bar.appendChild(fill);
        put('進捗（にーくら申告）', '<span style="color:var(--mk)">' + p.percent + '%</span>');
        wrap.appendChild(bar);
      }
      if (p.note) {
        var nt = document.createElement('div');
        nt.className = 'hint';
        nt.style.color = 'var(--text)';
        nt.textContent = '「' + p.note + '」';
        wrap.appendChild(nt);
      }
    }
    body.appendChild(wrap);
  });

  document.getElementById('projHint').innerHTML =
    '出しとるんは<b>数えるだけで分かること</b>だけ —— コミット数・未コミット数・最後に通ったビルドと検証・'
    + 'チェックボックスの数。<b>推定した数字は1つも出しとらん。</b><br>'
    + '<b>進捗率と一言は にーくらが <code>devshell/shell.config.json</code> に書く欄</b>（percent / note）。'
    + '書かんかったら出さん —— 勝手に 0% とは言わん。<br>'
    + '中身の深い表示は、そのプロジェクト自身のシェルの仕事。「開く」はシェルがあればそれを起動し、無ければフォルダを開く。';
}

/* ---- 画面への入口。軽い版（dist-dev/）と焼き込み版（dist/）の2本 ---- */
function drawScreens(status) {
  var el = document.getElementById('screens');
  var hasDev = !!(status && status.build);
  (CFG.screens || []).forEach(function (s) {
    var row = document.createElement('div');
    row.className = 'entryRow';
    var label = document.createElement('span');
    label.className = 'label';
    label.textContent = s.label;
    row.appendChild(label);

    var light = document.createElement('button');
    light.className = 'go';
    light.textContent = '軽い版';
    if (hasDev) light.addEventListener('click', function () { location.href = '/dev/' + s.file; });
    else light.disabled = true;      /* 押しても404になるボタンは出さん */
    row.appendChild(light);

    var baked = document.createElement('button');
    baked.textContent = '焼き込み版';
    baked.addEventListener('click', function () { location.href = '/' + s.file; });
    row.appendChild(baked);

    el.appendChild(row);
  });
  document.getElementById('screensHint').innerHTML = hasDev
    ? '軽い版は音をファイルで持っとるけん、サーバー経由でしか鳴らん。'
      + '単体で開けるんは焼き込み版のほう（外部参照ゼロの掟を守っとるのはこっち）。'
    : 'まだ軽量ビルドを作っとらん。<code>npm run build:dev</code> を叩いたら「軽い版」が使えるようになる。';
}

/* ---- 検証。合否だけやのうて必ず古さも出す ---- */
function drawVerify(status) {
  var headEl = document.getElementById('verifyHead');
  var bodyEl = document.getElementById('verifyBody');
  if (!status) { bodyEl.innerHTML = '<div class="hint">検証結果を読めんかった</div>'; return; }
  if (!status.verify) {
    bodyEl.innerHTML = '<div class="hint">まだ一度も走っとらん。<code>npm run verify</code> を叩いて</div>';
    return;
  }
  var v = status.verify, stages = v.stages || [];
  var passCount = stages.filter(function (s) { return s.ok === true; }).length;
  var age = formatAge(status.verifyAgeMs);
  var stale = status.verifyAgeMs != null && status.verifyAgeMs > DAY_MS;
  var head = (v.ok === true ? (stages.length + '段すべて通過') : (passCount + '/' + stages.length + '段通過'));
  if (age) head += '・' + age;
  if (stale) head += '（古い）';
  headEl.textContent = head;
  headEl.style.color = stale ? 'var(--accent)' : '';

  bodyEl.innerHTML = '';
  stages.forEach(function (s) {
    var color = s.skipped ? 'var(--dim)' : (s.ok ? 'var(--mk)' : 'var(--accent)');
    var label = s.skipped ? '走っとらん' : (s.ok ? '通過' : '失敗(終了コード ' + s.exitCode + ')');
    var row = document.createElement('div');
    row.className = 'stageRow';
    var left = document.createElement('span');
    left.style.color = color;
    left.textContent = s.label + '　' + label;
    row.appendChild(left);
    if (s.ms != null) {
      var right = document.createElement('span');
      right.className = 'hint';
      right.textContent = Math.round(s.ms / 100) / 10 + '秒';
      row.appendChild(right);
    }
    bodyEl.appendChild(row);
  });
}

/* ---- 保存したもの。data/ のファイルから読む（サーバーが正） ---- */
function drawStores(data) {
  var bodyEl = document.getElementById('monsBody');
  var hintEl = document.getElementById('monsHint');
  bodyEl.innerHTML = '';

  if (!data) {
    bodyEl.innerHTML = '<div class="hint">データの口が無い。サーバー経由で開いとるか確かめて</div>';
    hintEl.textContent = '';
    return;
  }

  var mons = data.mons || [];
  /* ラベルは shell.config.json から取る。ここに固有名を書かん（別プロジェクトへ持ち出せるように） */
  var monsLabel = ((CFG.storage || []).filter(function (e) { return e.shape === 'map-of-json-strings'; })[0] || {}).label || '個体';
  var tot = document.createElement('div');
  tot.className = 'tot';
  tot.textContent = monsLabel + '　' + mons.length + '体';
  bodyEl.appendChild(tot);

  mons.forEach(function (m) {
    var n = 0;
    if (Array.isArray(m.moves)) n += m.moves.length;
    if (Array.isArray(m.customMoves)) n += m.customMoves.length;
    var row = document.createElement('div');
    row.className = 'row';
    var a = document.createElement('span'); a.className = 'nm';
    a.textContent = m._slot || m.name || m.id;
    var b = document.createElement('span'); b.className = 'sub';
    b.textContent = kb((m._bytes || 0) + (m._mediaBytes || 0)) + '　技 ' + n + '本';
    row.appendChild(a); row.appendChild(b);
    bodyEl.appendChild(row);
  });

  var extras = [
    ['技の棚', data.lib ? Object.keys(data.lib).length : 0],
    ['草むら', Array.isArray(data.wild) ? data.wild.length : 0],
    ['音の割り当て（技）', data.audio && data.audio.moves ? Object.keys(data.audio.moves).length : 0],
    ['音の割り当て（システム）', data.audio && data.audio.system ? Object.keys(data.audio.system).length : 0]
  ];
  extras.forEach(function (e) {
    var row = document.createElement('div');
    row.className = 'row';
    var a = document.createElement('span'); a.className = 'nm'; a.textContent = e[0];
    var b = document.createElement('span'); b.className = 'sub'; b.textContent = e[1] + '件';
    row.appendChild(a); row.appendChild(b);
    bodyEl.appendChild(row);
  });

  var hint = '';
  if (!mons.length) {
    hint += '<b>data/monsters/ が空。</b>まだ移行しとらんなら <code>npm run migrate</code>。' +
            'それでも出んときは、保存が <code>file://</code> の箱に残っとる可能性がある' +
            '（保存データは<b>開き方（オリジン）ごとに別の箱</b>）。<br>';
  }
  hint += '「最終更新」はまだ出しとらん。ファイルの更新時刻を使えば出せるけん、次にやる。';
  hintEl.innerHTML = hint;
}

/* ---- 置き場。ファイルになったけん、もう5MB枠の話やない ---- */
function drawUsage(data) {
  var el = document.getElementById('usageBody');
  el.innerHTML = '';

  var head = document.createElement('div');
  head.className = 'tot';
  head.textContent = data ? ('data/ 合計 ' + kb(data.totalBytes) + '　' + (data.files || []).length + 'ファイル')
                          : 'data/ を読めんかった';
  el.appendChild(head);

  if (data) {
    var groups = {};
    (data.files || []).forEach(function (f) {
      var top = f.path.indexOf('/') >= 0 ? f.path.split('/')[0] : 'その他';
      groups[top] = (groups[top] || 0) + f.bytes;
    });
    Object.keys(groups).sort(function (a, b) { return groups[b] - groups[a]; }).forEach(function (g) {
      var row = document.createElement('div');
      row.className = 'row';
      var a = document.createElement('span'); a.className = 'nm'; a.textContent = g;
      var b = document.createElement('span'); b.className = 'sub'; b.textContent = kb(groups[g]);
      row.appendChild(a); row.appendChild(b);
      el.appendChild(row);
    });
  }

  var note = document.createElement('div');
  note.className = 'hint';
  note.innerHTML = '保存はファイルやけん、<b>ブラウザの 5MB 枠はもう関係無い</b>（ディスクの空きまで）。' +
                   'git で追跡されとるけん、壊しても <code>git checkout -- data</code> で戻る。';
  el.appendChild(note);
}

/* ---- 軽量ビルドの実測。無いものは0やのうて「まだ作っとらん」と出す ---- */
function drawBuild(status) {
  var headEl = document.getElementById('buildHead');
  var el = document.getElementById('buildBody');
  var b = status && status.build;
  if (!b) {
    headEl.textContent = '軽量ビルド';
    el.innerHTML = '<div class="hint">まだ作っとらん。<code>npm run build:dev</code> で作れる</div>';
    return;
  }
  var age = formatAge(status.buildAgeMs);
  var stale = status.buildAgeMs != null && status.buildAgeMs > DAY_MS;
  headEl.textContent = '軽量ビルド' + (age ? '・' + age : '') + (stale ? '（古い）' : '');
  headEl.style.color = stale ? 'var(--accent)' : '';

  var byFile = {};
  (CFG.screens || []).forEach(function (s) { byFile[s.file] = s.label; });

  (b.screens || []).forEach(function (s) {
    var pct = Math.round((1 - s.ratio) * 100);
    var row = document.createElement('div');
    row.className = 'row';
    var a = document.createElement('span'); a.className = 'nm';
    a.textContent = byFile[s.file] || s.file;
    var c = document.createElement('span'); c.className = 'sub';
    c.style.color = 'var(--mk)';
    c.textContent = kb(s.distBytes) + ' → ' + kb(s.devBytes) + '　' + pct + '%減';
    row.appendChild(a); row.appendChild(c);
    el.appendChild(row);
  });

  var se = document.createElement('div');
  se.className = 'hint';
  se.textContent = '音は ' + b.sounds + ' 本 / ' + kb(b.seBytes) + ' を外へ出して、鳴らす分だけ後から読む';
  el.appendChild(se);
}

/* 見出しを押したら畳む。自動更新はせん（開いた時に1回読むだけ）。 */
document.querySelectorAll('.sec>h2').forEach(function (h) {
  h.addEventListener('click', function () { h.parentNode.classList.toggle('closed'); });
});
</script>
</body>
</html>
